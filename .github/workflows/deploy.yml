name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Siapkan database D1 (dibuat otomatis jika belum ada)
        run: |
          if ! npx wrangler d1 info pulsaku >/dev/null 2>&1; then
            npx wrangler d1 create pulsaku
          fi
          ID=$(npx wrangler d1 info pulsaku --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).uuid))")
          test -n "$ID" || { echo "Gagal mengambil database_id"; exit 1; }
          sed -i "s/GANTI_DENGAN_DATABASE_ID/$ID/" wrangler.toml

      - name: Migrasi D1
        run: npx wrangler d1 execute pulsaku --remote --file=schema.sql

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: Daftarkan webhook Telegram
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "Worker URL: $URL"
          curl -sS "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=${URL%/}/webhook" \
            --data-urlencode "secret_token=${{ secrets.WEBHOOK_SECRET }}" \
            --data-urlencode "allowed_updates=[\"message\"]"
