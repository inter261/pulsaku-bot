name = "pulsaku-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Jangan diubah: workflow GitHub membuat database "pulsaku" otomatis
# dan mengganti placeholder di bawah dengan ID aslinya saat deploy.
[[d1_databases]]
binding = "DB"
database_name = "pulsaku"
database_id = "96fa789c-d71e-415b-acc1-cbe4ae14f519"

[vars]
# ID Telegram admin, pisahkan dengan koma. Contoh: "5359680210,123456"
ADMIN_IDS = "5359680210"
